name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser checks
        run: |
          export CHROMIUM="$(node -p "require('playwright-core').chromium.executablePath()")"
          node server.js &
          until curl -fs http://127.0.0.1:4176/ > /dev/null; do sleep 1; done
          failed=0
          check() {
            echo "== $1"
            if ! node "tests/$1.mjs" > "$RUNNER_TEMP/$1.log" 2>&1; then
              failed=1
              tail -n 25 "$RUNNER_TEMP/$1.log"
              echo "::error title=$1 failed::$(tail -n 12 "$RUNNER_TEMP/$1.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            else
              tail -n 1 "$RUNNER_TEMP/$1.log"
            fi
          }
          export BASE=http://127.0.0.1:4176
          for suite in browser browser-catalog browser-cleaner browser-files browser-archiver browser-pdf-editor browser-pdf-view browser-pdf-redact browser-pdf-sign; do
            check "$suite"
          done
          unset BASE
          check browser-offline
          exit "$failed"
