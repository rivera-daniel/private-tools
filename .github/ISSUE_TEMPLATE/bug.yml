name: Bug report
description: A tool gives a wrong result, fails or breaks a file.
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Image Inspector, Metadata Cleaner, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type
      placeholder: For example, iPhone HEIC photo or DOCX from Word 365
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not attach files that contain personal information. If the problem needs a sample file, describe how to make one or strip it first.
