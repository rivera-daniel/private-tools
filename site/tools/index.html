<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Browser-based file tools that run on your device. Inspect image metadata and more without uploading anything.">
<meta name="color-scheme" content="light dark">
<title>Private Tools</title>
<link rel="icon" href="/tools/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/tools/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tools/assets/site.css">
<link rel="stylesheet" href="/tools/assets/catalog.css">
<script src="/tools/assets/theme.js"></script>
</head>
<body class="catalog" data-page="catalog">
<header class="header wrap">
  <a class="brand" href="/tools/"><svg viewBox="0 0 44 30" aria-hidden="true"><path d="M14 4h10L10 25H0zM30 0h12L26 27H14z" fill="currentColor"/></svg>Private Tools</a>
  <nav aria-label="Primary">
    <a class="nav-text" href="/tools/roadmap/">Roadmap</a>
    <a class="nav-text" href="https://github.com/rivera-daniel/private-tools">GitHub</a>
    <button type="button" class="icon-button" id="theme-toggle" aria-label="Change theme"></button>
  </nav>
</header>

<main>
  <section class="cat-intro wrap" aria-labelledby="catalog-title">
    <h1 id="catalog-title">Your files. Your device. <span>Your tools.</span></h1>
    <p>Browser tools that run on your device. No uploads. No accounts.</p>
  </section>

  <div class="cat-body">
    <div class="cat-sentinel" id="bar-sentinel"></div>
    <div class="cat-bar" id="bar">
      <div class="cat-bar-inner wrap">
        <label class="cat-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <span class="visually-hidden">Search all tools, including planned ones</span>
          <input type="search" id="search" placeholder="Search tools" autocomplete="off" aria-controls="available results">
          <button type="button" class="cat-clear" id="clear" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
          <kbd>/</kbd>
        </label>
        <select class="cat-group-select" id="group-select" aria-label="Filter tools by category"></select>
      </div>
      <p class="visually-hidden" id="search-status" role="status" aria-live="polite"></p>
    </div>

    <section class="cat-section wrap" id="available" aria-labelledby="available-title" hidden>
      <div class="cat-head">
        <h2 id="available-title">Tools</h2>
        <p id="available-note"></p>
      </div>
      <div class="cat-grid" id="cards"></div>
    </section>

    <section class="cat-section wrap" id="results" aria-labelledby="results-title" hidden>
      <div class="cat-head">
        <h2 id="results-title">Results</h2>
        <p id="results-note"></p>
      </div>
      <div class="cat-rows" id="result-rows"></div>
    </section>
  </div>
  <p class="catalog-next wrap">More on the way. <a href="/tools/roadmap/">See what’s coming <span aria-hidden="true">↗</span></a></p>
</main>

<footer class="catalog-footer wrap">
  <span>© 2026 Daniel Rivera</span>
  <nav aria-label="Footer">
    <a href="/tools/roadmap/">Roadmap</a>
    <a href="https://github.com/rivera-daniel/private-tools">Source</a>
    <a href="https://github.com/rivera-daniel/private-tools#privacy-model">Privacy</a>
  </nav>
</footer>

<dialog id="tool-dialog" aria-labelledby="dialog-title">
  <form method="dialog"><button class="close" aria-label="Close">×</button></form>
  <p class="eyebrow" id="dialog-status"></p>
  <h2 id="dialog-title"></h2>
  <p id="dialog-copy"></p>
  <p>Not available yet. Follow its progress on the <a href="/tools/roadmap/"><u>roadmap</u></a>.</p>
  <form method="dialog"><button class="button">Back to tools</button></form>
</dialog>

<script type="module" src="/tools/assets/app.js"></script>
</body>
</html>
